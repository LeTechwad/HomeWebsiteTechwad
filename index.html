<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Techwad Portfolio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030d03; }
    ::-webkit-scrollbar-thumb { background: #1a5a10; }
    ::-webkit-scrollbar-thumb:hover { background: #39ff14; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #030d03;
      background-image: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, #39ff14 8%, #030d03) 0%, #030d03 65%);
      background-attachment: fixed;
      color: #39ff14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      animation: pageFadeIn 0.22s ease forwards;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 3px,
        rgba(0, 0, 0, 0.12) 3px, rgba(0, 0, 0, 0.12) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: #071207;
      border: 1px solid #1a5a10;
      padding: 48px 64px;
      text-align: center;
      position: relative;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid #1a5a10;
      pointer-events: none;
    }

    .card:hover {
      box-shadow: 0 0 0 1px rgba(57, 255, 20, 0.6), 0 4px 24px rgba(57, 255, 20, 0.3);
      transform: translateY(-2px);
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #39ff14;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.45), 0 0 20px rgba(57, 255, 20, 0.2);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #1a5a10;
      margin: 20px 0;
    }

    h2 {
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: normal;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #1a8a0a;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.2);
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      background: #39ff14;
      vertical-align: text-bottom;
      margin-left: 4px;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Techwad Portfolio</h1>
    <div class="divider"></div>
    <h2>Work In Progress<span class="cursor"></span></h2>
  </div>
</body>
</html>
